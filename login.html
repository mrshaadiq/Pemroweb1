<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>Login | PisangKita</title>

    <link rel="stylesheet" href="style.css?v=20261008-3">
    <script src="app.js?v=20261008-3" defer></script>
</head>

<body>

    <header class="simple-header">
        <a href="index.html" class="logo">PisangKita</a>
        <a href="index.html" class="btn btn-secondary">Kembali ke Beranda</a>
    </header>

    <main class="login-page">

        <section class="login-card">

            <h1>Masuk</h1>
            <p class="login-description">Masuk untuk melanjutkan ke akun PisangKita kamu.</p>

            <form data-form="login" action="#" method="post" novalidate>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        placeholder="nama@email.com"
                        required
                    >
                    <p class="field-error" data-error-for="email" hidden></p>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Masukkan kata sandi"
                            minlength="6"
                            required
                        >
                        <button type="button" class="password-toggle" aria-controls="password" aria-pressed="false">Tampilkan</button>
                    </div>
                    <p class="field-error" data-error-for="password" hidden></p>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" name="ingat" id="ingat">
                        Ingat saya
                    </label>
                    <a href="#" class="login-link">Lupa kata sandi?</a>
                </div>

                <p class="login-status" aria-live="polite" hidden></p>

                <button type="submit" class="btn btn-primary login-submit">Masuk</button>

            </form>

            <p class="login-register">
                Belum punya akun? <a href="register.html" class="login-link">Daftar sekarang</a>
            </p>

        </section>

    </main>

    <footer class="footer footer-white">
        <strong>PisangKita</strong>
        <p>© 2026 PisangKita • UMKM Lokal</p>
    </footer>

</body>
</html>
